<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Index</title>
    <link rel="stylesheet" href="dist/style.css" />
    <link
      rel="stylesheet"
      href="../BS/node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div class="modal-container">
      <button
        type="button"
        class="btn btn-primary"
        data-bs-toggle="modal"
        data-bs-tooletip="tooletip"
        data-bs-target="#exampleModal"
        data-bs-placement="top"
        title="Tooltip із довільним текстом"
      >
        Launch demo modal
      </button>
      <div
        class="modal fade"
        id="exampleModal"
        tabindex="-1"
        aria-labelledby="exampleModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="exampleModalLabel">Modal title</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">Деякi даннi</div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Close
              </button>
              <button type="button" class="btn btn-primary">
                Save changes
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div
      id="alert"
      style="display: none"
      class="alert alert-warning alert-dismissible fade show"
      role="alert"
    >
      <strong>Holy guacamole!</strong> You should check in on some of those
      fields below.
      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="alert"
        aria-label="Close"
      ></button>
    </div>

    <button id="btn_warning" type="button" class="btn btn-warning">
      Warning
    </button>

    <p id="my_DoB"></p>

    <div class="form">
      <label for="DoB_input"
        >Enter your date of birth: <br /><input
          type="text"
          id="DoB_input"
          placeholder="Format: 'yyyy.mm.dd'"
      /></label>
      <button id="formatDateBtn">Format date</button>
    </div>

    <script src="../BS/node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../moment/node_modules/moment/min/moment.min.js"></script>
    <script src="./dist/script-min.js"></script>
  </body>
</html>
