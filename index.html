<!DOCTYPE html>
<html>
  <head>
    <title>Parcel Sandbox</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <section class="app_conteiner">
        <div class = app>
            <form action="/no_action" id="add_user_form">
                <label for="add_user">
                    Add User
                    <input type="text" id="add_user">
                </label>
                <button type="submit" id="add_user_btn">Add User</button>
            </form>
            <table>
                <thead>
                    <tr>
                        <th>User name</th>
                        <th colspan="3">Actions</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
            <form action="/no_action" id="edit_user_form">
                <label for="edit_user">
                    Edit User
                    <input disabled type="text" id="edit_user">
                </label>
                <button type="submit" disabled id="edit_user_btn">Edit User</button>
            </form>
        </div>
    </section>

    <script src="script.js"></script>
  </body>
</html>
