<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Chat Simulator</title>
  </head>
  <body>
    <h2>Чат із браузером 🤖</h2>
    <div class="chat" id="chatBox"></div>

    <div class="input-row">
      <input
        type="text"
        id="userInput"
        placeholder="Напишіть повідомлення..."
      />
      <button id="sendBtn" onclick="sendMessage()">Надіслати</button>
    </div>
    <script src="./script.js"></script>
  </body>
</html>
