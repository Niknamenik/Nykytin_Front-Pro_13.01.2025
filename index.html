<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <form id="formData" action="/-server" method="GET">
        <label for="name">Full Name:
            <input name="full name" id="name" type="text">
        </label>

        <label for="DoB">Date of birth:
            <input name="date of birth" id="DoB" type="text">
        </label>

        <div class="sex">
            <label for="Sex_M">M<input name="sex" id="Sex_M" type="radio" value="M"></label>
            <label for="Sex_W">W<input name="sex" id="Sex_W" type="radio" value="W"></label>

        </div>
        <label for="city">City:
            <select name="city" id="city">
                <option value="dnipro">Dnipro</option>
                <option value="charkiv">Charkiv</option>
                <option value="kyiv">Kyiv</option>
                <option value="lviv">Lviv</option>
            </select>
        </label>

        <label for="address">Address:
            <input name="address" id="address" type="text">
        </label>

        <div class="languages">
            <label for="eng_lang">Eng<input id="eng_lang" name="language_eng" type="checkbox" value="eng"></label>
            <label for="ukr_lang">Ukr<input id="ukr_lang" name="language_ukr" type="checkbox" value="ukr"></label>
            <label for="pl_lang">Pl<input id="pl_lang" name="language_pl" type="checkbox" value="pl"></label>
            <label for="sp_lang">Sp<input id="sp_lang" name="language_sp" type="checkbox" value="sp"></label>
        </div>
        <input id="submit" type="submit" value="Save">
    </form>
    <script src="./script.js"></script>
</body>
</html>
