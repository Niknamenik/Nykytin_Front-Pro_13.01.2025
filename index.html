<!DOCTYPE html>
<html>
  <head>
    <title>Index</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2>Додати новий будинок</h2>
    <div id="house-form" class="block">
      <label
        >Кількість квартир: <input type="number" id="num-flats" required
      /></label>
      <label
        >Кількість мешканців у кожній квартирі:
        <input type="number" id="num-residents" required
      /></label>
      <button onclick="builder.createFlatsForm()">Створити квартири</button>
    </div>
    <div id="flats-section" class="hidden"></div>
    <button id="show-data-btn" class="hidden" onclick="builder.showHouseData()">
      Показати дані про будинок
    </button>

    <div id="output" class="block"></div>
    <script src="script.js"></script>
  </body>
</html>
